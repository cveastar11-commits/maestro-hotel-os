<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Maestro Hotel OS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 90%; max-width: 400px; text-align: center; }
        .login-box h2 { color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        .form-group input:focus { border-color: #667eea; outline: none; }
        .btn-login { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-login:hover { background: #5a6fd6; }
        .btn-login:disabled { background: #ccc; cursor: not-allowed; }
        .error-msg { color: #dc3545; margin-top: 15px; font-size: 14px; display: none; background: #f8d7da; padding: 10px; border-radius: 6px; }
        .test-users { margin-top: 20px; font-size: 12px; color: #666; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; }
        .test-users strong { color: #333; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🏨 Maestro Hotel OS</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="admin@maestrohotel.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
            <p class="error-msg" id="errorMsg"></p>
        </form>
        
        <div class="test-users">
            <strong>Usuarios de prueba:</strong><br>
            👑 admin@maestrohotel.com / admin123<br>
            💼 gerente@hotel.com / gerente123<br>
            🛎️ recepcion@hotel.com / recepcion123<br>
            📒 contador@hotel.com / contador123
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('btnLogin');

            // Estado de carga
            btn.textContent = 'Verificando...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // ✅ GUARDAR TOKEN Y DATOS DEL USUARIO (INCLUYENDO EL ROL)
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // ✅ REDIRECCIÓN AUTOMÁTICA AL DASHBOARD
                    window.location.href = '/dashboard.html';
                } else {
                    // Mostrar error si las credenciales son incorrectas
                    errorMsg.textContent = data.error || 'Credenciales incorrectas';
                    errorMsg.style.display = 'block';
                    btn.textContent = 'Iniciar Sesión';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                errorMsg.textContent = 'Error de conexión con el servidor. Verifique su internet.';
                errorMsg.style.display = 'block';
                btn.textContent = 'Iniciar Sesión';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

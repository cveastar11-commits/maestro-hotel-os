<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Maestro Hotel OS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .nav { display: flex; gap: 20px; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: background 0.3s; }
        .nav a:hover { background: rgba(255,255,255,0.2); }
        .nav a.active { background: rgba(255,255,255,0.3); font-weight: 600; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 28px; margin-bottom: 30px; color: #333; display: flex; justify-content: space-between; align-items: center; }
        .add-btn { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .users-table { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #667eea; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
        .role-badge { padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: 600; }
        .role-admin { background: #667eea; color: white; }
        .role-recepcionista { background: #28a745; color: white; }
        .role-housekeeping { background: #ffc107; color: #333; }
        .edit-btn { background: #17a2b8; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .close { font-size: 28px; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; }
        .submit-btn { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="guests.html">Huéspedes</a>
            <a href="reservations.html">Reservas</a>
            <a href="reports.html">Reportes</a>
            <a href="invoices.html">Facturación</a>
            <a href="inventory.html">Inventario</a>
            <a href="housekeeping.html">Housekeeping</a>
            <a href="users.html" class="active">Usuarios</a>
        </div>
    </div>

    <div class="container">
        <div class="section-title">
            <span>👥 Gestión de Usuarios</span>
            <button class="add-btn" onclick="openModal()">+ Nuevo Usuario</button>
        </div>
        
        <div class="users-table">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Nombre</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4">Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Usuario</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label>Contraseña</label>
                    <input type="password" id="password">
                </div>
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <select id="role" required>
                        <option value="admin">Administrador</option>
                        <option value="recepcionista">Recepcionista</option>
                        <option value="housekeeping">Housekeeping</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Guardar</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadUsers() {
            try {
                const response = await fetch('/api/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Error al cargar');
                }
                
                const users = await response.json();
                const tbody = document.getElementById('usersTableBody');
                
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">No hay usuarios registrados</td></tr>';
                    return;
                }

                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.email}</td>
                        <td>${user.full_name}</td>
                        <td><span class="role-badge role-${user.role}">${user.role}</span></td>
                        <td>
                            <button class="edit-btn" onclick="editUser('${user.id}', '${user.email}', '${user.full_name}', '${user.role}')">Editar</button>
                            <button class="delete-btn" onclick="deleteUser('${user.id}')">Eliminar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('usersTableBody').innerHTML = 
                    `<tr><td colspan="4" style="color:red; text-align:center; padding: 20px;">Error: ${error.message}</td></tr>`;
            }
        }

        function openModal(isEdit = false) { 
            document.getElementById('modalTitle').textContent = isEdit ? 'Editar Usuario' : 'Nuevo Usuario';
            document.getElementById('passwordGroup').style.display = isEdit ? 'none' : 'block';
            document.getElementById('userModal').style.display = 'block'; 
        }
        
        function closeModal() { 
            document.getElementById('userModal').style.display = 'none'; 
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
        }

        function editUser(id, email, fullName, role) {
            document.getElementById('userId').value = id;
            document.getElementById('email').value = email;
            document.getElementById('fullName').value = fullName;
            document.getElementById('role').value = role;
            openModal(true);
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const data = {
                email: document.getElementById('email').value,
                full_name: document.getElementById('fullName').value,
                role: document.getElementById('role').value
            };
            
            if (!id) {
                data.password = document.getElementById('password').value;
            }

            try {
                const url = id ? `/api/users/${id}` : '/api/users';
                const method = id ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Error al guardar');
                
                closeModal();
                loadUsers();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        async function deleteUser(id) {
            if (!confirm('¿Estás seguro de eliminar este usuario?')) return;
            try {
                const response = await fetch(`/api/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Error al eliminar');
                loadUsers();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        loadUsers();
    </script>
</body>
</html>

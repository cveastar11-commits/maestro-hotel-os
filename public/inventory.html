<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="inventory.html" class="active">📦 Inventario</a>
            <a href="accounting.html">💰 Contabilidad</a>
            <a href="reports.html">📈 Reportes</a>
            <a href="users.html">👥 Usuarios</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Modo Oscuro</button>
            <a href="#" onclick="cerrarSesion()">🚪 Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>📦 Gestión de Inventario</h2>
            <button class="btn btn-primary" onclick="abrirModalNuevo()">+ Nuevo Producto</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Cantidad</th>
                    <th>Costo Unit.</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="modalNuevo" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:20px;">Nuevo Producto</h3>
            <form id="formNuevo">
                <input type="hidden" id="productoId">
                <div class="form-group"><label>Nombre</label><input type="text" id="nuevoNombre" required></div>
                <div class="form-group"><label>Categoría</label><input type="text" id="nuevoCategoria" required></div>
                <div class="form-row">
                    <div class="form-group"><label>Cantidad</label><input type="number" id="nuevoCantidad" step="0.01" required></div>
                    <div class="form-group"><label>Costo Unitario</label><input type="number" id="nuevoCosto" step="0.01" required></div>
                </div>
                <button type="submit" class="btn btn-success" style="width:100%">Guardar</button>
                <button type="button" onclick="cerrarModalNuevo()" class="btn btn-danger" style="width:100%; margin-top:10px;">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        async function cargar() {
            try {
                const resp = await fetch('/api/inventory', { headers: { 'Authorization': 'Bearer ' + token } });
                const productos = await resp.json();
                const tabla = document.getElementById('tabla');
                
                if (productos.length === 0) {
                    tabla.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px;">No hay productos registrados.</td></tr>';
                    return;
                }
                
                tabla.innerHTML = '';
                productos.forEach(p => {
                    const estado = p.quantity <= p.min_stock ? '<span style="color:#dc3545; font-weight:bold;">⚠️ Bajo</span>' : '<span style="color:#28a745; font-weight:bold;">✅ OK</span>';
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${p.product_name}</td>
                        <td>${p.category}</td>
                        <td>${p.quantity} ${p.unit}</td>
                        <td>$${parseFloat(p.cost_per_unit).toFixed(2)}</td>
                        <td>${estado}</td>
                        <td>
                            <a href="edit-product.html?id=${p.id}" class="btn btn-primary" style="padding:5px 10px; font-size:12px;">Editar</a>
                            <button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" onclick="eliminar(${p.id})">Eliminar</button>
                        </td>
                    `;
                    tabla.appendChild(fila);
                });
            } catch (e) { alert('Error al cargar inventario'); }
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar este producto?')) return;
            await fetch('/api/inventory/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            cargar();
        }

        function abrirModalNuevo() { document.getElementById('modalNuevo').style.display = 'block'; }
        function cerrarModalNuevo() { 
            document.getElementById('modalNuevo').style.display = 'none'; 
            document.getElementById('formNuevo').reset(); 
        }

        document.getElementById('formNuevo').addEventListener('submit', async function(e) {
            e.preventDefault();
            const datos = {
                product_name: document.getElementById('nuevoNombre').value,
                category: document.getElementById('nuevoCategoria').value,
                quantity: parseFloat(document.getElementById('nuevoCantidad').value),
                unit: 'unidades', min_stock: 0,
                cost_per_unit: parseFloat(document.getElementById('nuevoCosto').value),
                supplier: 'Proveedor Local'
            };
            await fetch('/api/inventory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(datos)
            });
            cerrarModalNuevo();
            cargar();
        });

        // MODO OSCURO Y SESIÓN
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            document.querySelector('.theme-toggle').textContent = document.body.classList.contains('dark-mode') ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').textContent = '☀️ Modo Claro';
        }
        function cerrarSesion() { if(confirm('¿Cerrar sesión?')) { localStorage.clear(); window.location.href = '/login.html'; } }

        cargar();
    </script>
</body>
</html>

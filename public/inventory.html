<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Prueba</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #667eea; color: white; }
        .btn { padding: 8px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .edit { background: #17a2b8; }
        .delete { background: #dc3545; }
    </style>
</head>
<body>
    <h1>📦 Inventario (Versión de Prueba)</h1>
    <p>Si ve esta página, el archivo nuevo SÍ se cargó.</p>
    
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla">
            <!-- Aquí se cargarán los productos -->
        </tbody>
    </table>

    <script>
        console.log("✅ SCRIPT CARGADO CORRECTAMENTE");
        
        const token = localStorage.getItem('token');
        if (!token) { 
            alert("No hay sesión. Redirigiendo al login...");
            window.location.href = '/login.html'; 
        }

        async function cargar() {
            try {
                const resp = await fetch('/api/inventory', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const productos = await resp.json();
                const tabla = document.getElementById('tabla');
                
                productos.forEach(p => {
                    const fila = document.createElement('tr');
                    // AQUÍ ESTÁ LA CLAVE: El alert está directamente en el HTML
                    fila.innerHTML = `
                        <td>${p.product_name}</td>
                        <td>${p.quantity}</td>
                        <td>
                            <button class="btn edit" onclick="alert('¡ÉXITO! El botón Editar funciona para el producto: ${p.product_name}')">Editar</button>
                            <button class="btn delete" onclick="alert('¡ÉXITO! El botón Eliminar funciona para el ID: ${p.id}')">Eliminar</button>
                        </td>
                    `;
                    tabla.appendChild(fila);
                });
            } catch (e) {
                document.getElementById('tabla').innerHTML = '<tr><td colspan="3">Error al cargar. Verifique que inició sesión.</td></tr>';
            }
        }

        cargar();
    </script>
</body>
</html>

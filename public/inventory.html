<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #667eea; color: white; }
        .btn { padding: 8px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        .edit { background: #17a2b8; }
        .delete { background: #dc3545; }
        .add { background: #667eea; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>📦 Inventario</h1>
    <a href="new-product.html" class="btn add">+ Nuevo Producto</a>
    
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/login.html'; }

        async function cargar() {
            try {
                const resp = await fetch('/api/inventory', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const productos = await resp.json();
                const tabla = document.getElementById('tabla');
                
                productos.forEach(p => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${p.product_name}</td>
                        <td>${p.quantity}</td>
                        <td>
                            <a href="edit-product.html?id=${p.id}" class="btn edit">Editar</a>
                            <button class="btn delete" onclick="eliminar(${p.id})">Eliminar</button>
                        </td>
                    `;
                    tabla.appendChild(fila);
                });
            } catch (e) {
                document.getElementById('tabla').innerHTML = '<tr><td colspan="3">Error al cargar</td></tr>';
            }
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar este producto?')) return;
            await fetch('/api/inventory/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            cargar();
        }

        cargar();
    </script>
</body>
</html>

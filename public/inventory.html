<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Maestro Hotel OS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .nav { display: flex; gap: 20px; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: background 0.3s; }
        .nav a:hover { background: rgba(255,255,255,0.2); }
        .nav a.active { background: rgba(255,255,255,0.3); font-weight: 600; }
        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .section-title { font-size: 28px; margin-bottom: 30px; color: #333; display: flex; justify-content: space-between; align-items: center; }
        .add-btn { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; }
        .add-btn:hover { background: #5a6fd6; }
        .inventory-table { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #667eea; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
        .low-stock { background: #f8d7da; color: #721c24; padding: 5px 12px; border-radius: 15px; font-weight: 600; font-size: 12px; }
        .good-stock { background: #d4edda; color: #155724; padding: 5px 12px; border-radius: 15px; font-weight: 600; font-size: 12px; }
        .edit-btn { background: #17a2b8; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 5% auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 600px; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { color: #333; }
        .close-btn { font-size: 32px; font-weight: bold; cursor: pointer; color: #999; background: none; border: none; }
        .close-btn:hover { color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .submit-btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background: #5a6fd6; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="guests.html">Huéspedes</a>
            <a href="reservations.html">Reservas</a>
            <a href="reports.html">Reportes</a>
            <a href="invoices.html">Facturación</a>
            <a href="inventory.html" class="active">Inventario</a>
            <a href="housekeeping.html">Housekeeping</a>
            <a href="users.html">Usuarios</a>
        </div>
    </div>

    <div class="container">
        <div class="section-title">
            <span>📦 Inventario</span>
            <button class="add-btn" onclick="abrirModal()">+ Nuevo Producto</button>
        </div>

        <div class="inventory-table">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Cantidad</th>
                        <th>Unidad</th>
                        <th>Stock Mín</th>
                        <th>Costo Unit.</th>
                        <th>Proveedor</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaInventario"></tbody>
            </table>
        </div>
    </div>

    <div id="miModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="tituloModal">Nuevo Producto</h2>
                <button class="close-btn" onclick="cerrarModal()">&times;</button>
            </div>
            <form id="formularioProducto">
                <input type="hidden" id="productoId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="nombreProducto" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <input type="text" id="categoria" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Cantidad</label>
                        <input type="number" id="cantidad" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Unidad</label>
                        <input type="text" id="unidad" placeholder="kg, litros, unidades" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Stock Mínimo</label>
                        <input type="number" id="stockMinimo" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Costo Unitario ($)</label>
                        <input type="number" id="costoUnitario" step="0.01" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Proveedor</label>
                    <input type="text" id="proveedor" required>
                </div>
                <button type="submit" class="submit-btn">💾 Guardar Producto</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login.html';
        }

        document.addEventListener('DOMContentLoaded', cargarInventario);

        async function cargarInventario() {
            try {
                const respuesta = await fetch('/api/inventory', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const productos = await respuesta.json();
                const tabla = document.getElementById('tablaInventario');
                tabla.innerHTML = '';

                if (productos.length === 0) {
                    tabla.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#999;">No hay productos en el inventario. Haz clic en "+ Nuevo Producto" para agregar uno.</td></tr>';
                    return;
                }

                productos.forEach(function(p) {
                    const claseStock = p.quantity <= p.min_stock ? 'low-stock' : 'good-stock';
                    const textoStock = p.quantity <= p.min_stock ? '⚠️ Bajo' : '✅ OK';
                    const fila = document.createElement('tr');
                    fila.innerHTML =
                        '<td>' + p.product_name + '</td>' +
                        '<td>' + p.category + '</td>' +
                        '<td>' + p.quantity + '</td>' +
                        '<td>' + p.unit + '</td>' +
                        '<td>' + p.min_stock + '</td>' +
                        '<td>$' + parseFloat(p.cost_per_unit).toFixed(2) + '</td>' +
                        '<td>' + p.supplier + '</td>' +
                        '<td><span class="' + claseStock + '">' + textoStock + '</span></td>' +
                        '<td>' +
                            '<button class="edit-btn" onclick="editarProducto(' + p.id + ')">Editar</button>' +
                            '<button class="delete-btn" onclick="eliminarProducto(' + p.id + ')">Eliminar</button>' +
                        '</td>';
                    tabla.appendChild(fila);
                });
            } catch (error) {
                alert('Error al cargar el inventario. Verifica tu conexión.');
            }
        }

        function abrirModal() {
            document.getElementById('miModal').style.display = 'block';
            document.getElementById('tituloModal').textContent = 'Nuevo Producto';
            document.getElementById('formularioProducto').reset();
            document.getElementById('productoId').value = '';
        }

        function cerrarModal() {
            document.getElementById('miModal').style.display = 'none';
        }

        async function editarProducto(id) {
            try {
                const respuesta = await fetch('/api/inventory', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const productos = await respuesta.json();
                const p = productos.find(function(prod) { return prod.id === id; });

                if (p) {
                    document.getElementById('miModal').style.display = 'block';
                    document.getElementById('tituloModal').textContent = 'Editar Producto';
                    document.getElementById('productoId').value = p.id;
                    document.getElementById('nombreProducto').value = p.product_name;
                    document.getElementById('categoria').value = p.category;
                    document.getElementById('cantidad').value = p.quantity;
                    document.getElementById('unidad').value = p.unit;
                    document.getElementById('stockMinimo').value = p.min_stock;
                    document.getElementById('costoUnitario').value = p.cost_per_unit;
                    document.getElementById('proveedor').value = p.supplier;
                }
            } catch (error) {
                alert('Error al cargar los datos del producto.');
            }
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Está seguro de eliminar este producto?')) return;
            try {
                await fetch('/api/inventory/' + id, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                cargarInventario();
            } catch (error) {
                alert('Error al eliminar el producto.');
            }
        }

        document.getElementById('formularioProducto').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('productoId').value;
            const datos = {
                product_name: document.getElementById('nombreProducto').value,
                category: document.getElementById('categoria').value,
                quantity: parseFloat(document.getElementById('cantidad').value),
                unit: document.getElementById('unidad').value,
                min_stock: parseFloat(document.getElementById('stockMinimo').value),
                cost_per_unit: parseFloat(document.getElementById('costoUnitario').value),
                supplier: document.getElementById('proveedor').value
            };

            try {
                const url = id ? '/api/inventory/' + id : '/api/inventory';
                const metodo = id ? 'PUT' : 'POST';
                await fetch(url, {
                    method: metodo,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(datos)
                });
                cerrarModal();
                cargarInventario();
            } catch (error) {
                alert('Error al guardar el producto.');
            }
        });

        window.onclick = function(event) {
            if (event.target === document.getElementById('miModal')) {
                cerrarModal();
            }
        };
    </script>
</body>
</html>

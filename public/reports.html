<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="inventory.html">📦 Inventario</a>
            <a href="accounting.html">💰 Contabilidad</a>
            <a href="guests.html">👥 Ocupación</a>
            <a href="billing.html">💳 Facturación</a>
            <a href="reports.html" class="active">📈 Reportes</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
            <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
        </div>
    </div>

    <div class="container">
        <h2>📈 Reportes Gerenciales</h2>
        
        <div class="summary-box">
            <div class="summary-card"><h3>Ocupación Promedio</h3><div class="amount">75%</div></div>
            <div class="summary-card"><h3>Tarifa Promedio</h3><div class="amount">$120.00</div></div>
            <div class="summary-card"><h3>RevPAR</h3><div class="amount">$90.00</div></div>
        </div>

        <div class="card" style="height: 400px;">
            <h3>📊 Tendencia de Ocupación Mensual</h3>
            <canvas id="graficoOcupacion"></canvas>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        new Chart(document.getElementById('graficoOcupacion'), {
            type: 'line',
            data: {
                labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'],
                datasets: [{
                    label: '% Ocupación',
                    data: [65, 59, 80, 81, 56, 75],
                    borderColor: '#667eea',
                    tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        function cerrarSesion() { if(confirm('¿Salir?')) { localStorage.clear(); window.location.href = '/login.html'; } }
    </script>
</body>
</html>

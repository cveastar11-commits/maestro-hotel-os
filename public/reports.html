<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="inventory.html" class="menu-inventario">📦 Inventario</a>
            <a href="accounting.html" class="menu-contabilidad">💰 Contabilidad</a>
            <a href="reports.html" class="active menu-reportes">📈 Reportes</a>
            <a href="users.html" class="menu-usuarios">👥 Usuarios</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Modo Oscuro</button>
            <a href="#" onclick="cerrarSesion()">🚪 Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <h2 style="margin-bottom: 25px;">📈 Centro de Reportes</h2>
        
        <div class="card">
            <h3>Estado de Resultados Resumido</h3>
            <div class="summary-box" style="margin-top: 20px;">
                <div class="summary-card"><h3>Ingresos</h3><div class="amount" id="repIngresos">$0.00</div></div>
                <div class="summary-card"><h3>Gastos</h3><div class="amount" id="repGastos">$0.00</div></div>
                <div class="summary-card"><h3>Utilidad</h3><div class="amount" id="repUtilidad">$0.00</div></div>
            </div>
        </div>

        <div class="card">
            <h3>Balance de Comprobación</h3>
            <table>
                <thead><tr><th>Cuenta</th><th>Tipo</th><th>Débito</th><th>Crédito</th><th>Saldo</th></tr></thead>
                <tbody id="tablaBalance"></tbody>
            </table>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        // Permisos
        const userData = JSON.parse(localStorage.getItem('user') || '{}');
        if (userData.role === 'recepcionista') window.location.href = '/dashboard.html';

        async function cargarReportes() {
            try {
                const incResp = await fetch('/api/income-statement', { headers: { 'Authorization': 'Bearer ' + token } });
                const incData = await incResp.json();
                document.getElementById('repIngresos').textContent = '$' + incData.totalIncome.toFixed(2);
                document.getElementById('repGastos').textContent = '$' + incData.totalExpenses.toFixed(2);
                document.getElementById('repUtilidad').textContent = '$' + incData.netIncome.toFixed(2);

                const balResp = await fetch('/api/trial-balance', { headers: { 'Authorization': 'Bearer ' + token } });
                const balData = await balResp.json();
                document.getElementById('tablaBalance').innerHTML = balData.map(b => `
                    <tr>
                        <td>${b.code} - ${b.name}</td>
                        <td>${b.type}</td>
                        <td>$${parseFloat(b.total_debit).toFixed(2)}</td>
                        <td>$${parseFloat(b.total_credit).toFixed(2)}</td>
                        <td><strong>$${parseFloat(b.balance).toFixed(2)}</strong></td>
                    </tr>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            document.querySelector('.theme-toggle').textContent = document.body.classList.contains('dark-mode') ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').textContent = '☀️ Modo Claro';
        }

        function cerrarSesion() {
            if(confirm('¿Cerrar sesión?')) { localStorage.clear(); window.location.href = '/login.html'; }
        }

        cargarReportes();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav">
            <a href="dashboard.html" class="active">📊 Dashboard</a>
            <a href="inventory.html" class="menu-inventario">📦 Inventario</a>
            <a href="accounting.html" class="menu-contabilidad">💰 Contabilidad</a>
            <a href="reports.html" class="menu-reportes">📈 Reportes</a>
            <a href="users.html" class="menu-usuarios">👥 Usuarios</a>
            <a href="#" onclick="cerrarSesion()">🚪 Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <h2 style="margin-bottom: 20px;">📊 Panel de Control</h2>
        
        <div class="summary-box">
            <div class="summary-card">
                <h3>Habitaciones Ocupadas</h3>
                <div class="amount" id="habitacionesOcupadas">0</div>
            </div>
            <div class="summary-card">
                <h3>Huéspedes Hoy</h3>
                <div class="amount" id="huespedesHoy">0</div>
            </div>
            <div class="summary-card">
                <h3>Ingresos del Mes</h3>
                <div class="amount" id="ingresosMes" style="color:#28a745;">$0.00</div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 15px;">👋 Bienvenido, <span id="nombreUsuario">Usuario</span></h3>
            <p style="color: #666;">Rol: <strong id="rolUsuario">-</strong></p>
            <p style="color: #666; margin-top: 10px;">Fecha: <strong id="fechaActual">-</strong></p>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 15px;">⚡ Accesos Rápidos</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a href="inventory.html" class="btn btn-primary">📦 Ver Inventario</a>
                <a href="accounting.html" class="btn btn-primary">💰 Contabilidad</a>
                <a href="reports.html" class="btn btn-primary">📈 Reportes</a>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const userData = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token) { window.location.href = '/login.html'; }

        // Mostrar datos del usuario
        document.getElementById('nombreUsuario').textContent = userData.name || 'Usuario';
        document.getElementById('rolUsuario').textContent = userData.role || 'recepcionista';
        document.getElementById('fechaActual').textContent = new Date().toLocaleDateString('es-ES', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        // Control de permisos según rol
        const userRole = userData.role;
        console.log('🔍 Rol detectado:', userRole);

        if (!userRole || userRole === 'admin') {
            console.log('✅ Acceso total de Administrador');
        } else if (userRole === 'contador') {
            document.querySelectorAll('.menu-inventario, .menu-usuarios').forEach(el => {
                if (el) el.style.display = 'none';
            });
        } else if (userRole === 'recepcionista') {
            document.querySelectorAll('.menu-contabilidad, .menu-reportes, .menu-usuarios').forEach(el => {
                if (el) el.style.display = 'none';
            });
        } else if (userRole === 'gerente') {
            document.querySelectorAll('.menu-usuarios').forEach(el => {
                if (el) el.style.display = 'none';
            });
        }

        // Cargar estadísticas básicas
        async function cargarEstadisticas() {
            try {
                // Ingresos del mes
                const resp = await fetch('/api/income-statement', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await resp.json();
                document.getElementById('ingresosMes').textContent = '$' + data.totalIncome.toFixed(2);
            } catch (e) {
                console.error('Error al cargar estadísticas:', e);
            }
        }

        function cerrarSesion() {
            if (confirm('¿Está seguro de cerrar sesión?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            }
        }

        cargarEstadisticas();
    </script>
</body>
</html>

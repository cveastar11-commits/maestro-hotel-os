<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visión Gerencial - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .vision-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: white; padding: 25px; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .kpi-card:hover { transform: translateY(-5px); }
        .kpi-value { font-size: 36px; font-weight: 800; color: #333; margin: 10px 0; }
        .kpi-label { color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        
        .chart-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 400px; }
        
        body.dark-mode .kpi-card, body.dark-mode .chart-container { background: #1e1e1e; }
        body.dark-mode .kpi-value { color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS | Visión Gerencial</h1>
        <div class="nav" id="mainNav"></div>
    </div>

    <div class="container">
        <!-- KPIs PRINCIPALES -->
        <div class="vision-grid">
            <div class="kpi-card" style="border-top: 4px solid #667eea;">
                <div class="kpi-label">Ocupación Hoy</div>
                <div class="kpi-value">85%</div>
                <small style="color:#28a745;">▲ 5% vs ayer</small>
            </div>
            <div class="kpi-card" style="border-top: 4px solid #28a745;">
                <div class="kpi-label">Ingresos del Mes</div>
                <div class="kpi-value">$12,450</div>
                <small style="color:#28a745;">▲ 12% vs mes pasado</small>
            </div>
            <div class="kpi-card" style="border-top: 4px solid #dc3545;">
                <div class="kpi-label">Gastos Operativos</div>
                <div class="kpi-value">$4,200</div>
                <small style="color:#dc3545;">▼ 2% ahorro</small>
            </div>
            <div class="kpi-card" style="border-top: 4px solid #ffc107;">
                <div class="kpi-label">Huéspedes Activos</div>
                <div class="kpi-value">24</div>
                <small>3 Check-outs pendientes</small>
            </div>
        </div>

        <!-- GRÁFICO DE RENDIMIENTO -->
        <div class="chart-container">
            <h3>📊 Rendimiento Semanal (Ingresos vs Ocupación)</h3>
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <script src="nav.js"></script>
    <script>renderNav('dashboard.html');</script>

    <script>
        // Gráfico Profesional
        new Chart(document.getElementById('mainChart'), {
            type: 'bar',
            data: {
                labels: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'],
                datasets: [{
                    label: 'Ingresos ($)',
                    data: [1200, 1900, 3000, 5000, 2300, 3400, 4100],
                    backgroundColor: '#667eea',
                    borderRadius: 5
                }, {
                    label: 'Ocupación (%)',
                    data: [60, 75, 80, 95, 70, 85, 90],
                    type: 'line',
                    borderColor: '#28a745',
                    borderWidth: 3,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'top' } }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Habitaciones - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav" id="mainNav"></div>
    </div>
    <script src="nav.js"></script>
    <script>renderNav('rooms.html');</script>

    <div class="container">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>🛏️ Gestión de Habitaciones</h2>
                <button class="btn btn-primary" onclick="abrirModalHab()">+ Nueva Habitación</button>
            </div>
            <table>
                <thead><tr><th>Número</th><th>Tipo</th><th>Capacidad</th><th>Precio Base</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody id="tablaHabs"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="modalHab" class="modal">
        <div class="modal-content">
            <h3>Configurar Habitación</h3>
            <form id="formHab">
                <div class="form-row">
                    <div class="form-group"><label>Número</label><input type="text" id="habNum" required></div>
                    <div class="form-group"><label>Tipo</label>
                        <select id="habType"><option>Standard</option><option>Deluxe</option><option>Suite</option></select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Capacidad (Max)</label><input type="number" id="habCap" value="2"></div>
                    <div class="form-group"><label>Precio Base ($)</label><input type="number" id="habPrice" step="0.01"></div>
                </div>
                <button type="submit" class="btn btn-success" style="width:100%">Guardar</button>
                <button type="button" onclick="document.getElementById('modalHab').style.display='none'" class="btn btn-danger" style="width:100%; margin-top:10px;">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        // Simulación de base de datos de habitaciones
        let habs = [
            { num: '101', type: 'Standard', cap: 2, price: 80, status: 'Activa' },
            { num: '102', type: 'Standard', cap: 2, price: 80, status: 'Activa' },
            { num: '201', type: 'Suite', cap: 4, price: 150, status: 'Mantenimiento' }
        ];

        function renderHabs() {
            const tbody = document.getElementById('tablaHabs');
            tbody.innerHTML = habs.map(h => `
                <tr>
                    <td><strong>${h.num}</strong></td>
                    <td>${h.type}</td>
                    <td>${h.cap} pax</td>
                    <td>$${h.price}</td>
                    <td><span style="color:${h.status==='Activa'?'green':'orange'}">${h.status}</span></td>
                    <td><button class="btn btn-primary" style="padding:5px 10px;">Editar</button></td>
                </tr>
            `).join('');
        }

        function abrirModalHab() { document.getElementById('modalHab').style.display = 'block'; }
        
        document.getElementById('formHab').addEventListener('submit', (e) => {
            e.preventDefault();
            habs.push({
                num: document.getElementById('habNum').value,
                type: document.getElementById('habType').value,
                cap: document.getElementById('habCap').value,
                price: document.getElementById('habPrice').value,
                status: 'Activa'
            });
            document.getElementById('modalHab').style.display = 'none';
            renderHabs();
            alert('✅ Habitación creada');
        });

        renderHabs();
    </script>
</body>
</html>

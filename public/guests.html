<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ocupación - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="inventory.html">📦 Inventario</a>
            <a href="accounting.html">💰 Contabilidad</a>
            <a href="guests.html" class="active">👥 Ocupación</a>
            <a href="billing.html">💳 Facturación</a>
            <a href="reports.html">📈 Reportes</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
            <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h3>🗺️ Estado de Habitaciones (Clic para gestionar)</h3>
            <div class="habitacion-grid" id="mapa"></div>
        </div>

        <div class="card">
            <h3>📋 Movimientos de Hoy</h3>
            <table>
                <thead><tr><th>Huésped</th><th>Hab.</th><th>Acción</th><th>Hora</th></tr></thead>
                <tbody id="tablaMovimientos"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Gestión -->
    <div id="modalGestion" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;">
        <div style="background:white; margin:10% auto; padding:30px; border-radius:10px; width:300px; text-align:center;">
            <h3 id="tituloHab">Habitación</h3>
            <p id="infoHab">Estado actual</p>
            <input type="text" id="nombreHuesped" placeholder="Nombre del Huésped" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px;">
            <button class="btn btn-success" onclick="confirmarAccion()" style="width:100%">Confirmar</button>
            <button class="btn btn-danger" onclick="cerrarModal()" style="width:100%; margin-top:10px;">Cancelar</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        // Datos simulados en memoria para velocidad extrema
        let habitaciones = [
            { num: '101', status: 'libre', huesped: '' },
            { num: '102', status: 'ocupada', huesped: 'J. Pérez' },
            { num: '103', status: 'libre', huesped: '' },
            { num: '104', status: 'ocupada', huesped: 'M. López' },
            { num: '105', status: 'libre', huesped: '' },
            { num: '201', status: 'ocupada', huesped: 'A. García' },
            { num: '202', status: 'libre', huesped: '' },
            { num: '203', status: 'libre', huesped: '' },
        ];

        let habSeleccionada = null;

        function renderizar() {
            const mapa = document.getElementById('mapa');
            mapa.innerHTML = '';
            habitaciones.forEach(h => {
                const div = document.createElement('div');
                div.className = `hab-card ${h.status}`;
                div.innerHTML = `<strong>${h.num}</strong><br><small>${h.status.toUpperCase()}</small>`;
                if (h.huesped) div.innerHTML += `<br><span style="font-size:10px">${h.huesped}</span>`;
                div.onclick = () => abrirGestion(h);
                mapa.appendChild(div);
            });
        }

        function abrirGestion(h) {
            habSeleccionada = h;
            document.getElementById('modalGestion').style.display = 'block';
            document.getElementById('tituloHab').textContent = 'Habitación ' + h.num;
            document.getElementById('infoHab').textContent = h.status === 'libre' ? 'Disponible para Check-in' : `Ocupada por: ${h.huesped}`;
            document.getElementById('nombreHuesped').value = h.huesped;
        }

        function confirmarAccion() {
            const nombre = document.getElementById('nombreHuesped').value;
            if (habSeleccionada.status === 'libre' && nombre) {
                habSeleccionada.status = 'ocupada';
                habSeleccionada.huesped = nombre;
                alert(`✅ Check-in realizado en Hab. ${habSeleccionada.num}`);
            } else if (habSeleccionada.status === 'ocupada') {
                habSeleccionada.status = 'libre';
                habSeleccionada.huesped = '';
                alert(`✅ Check-out realizado en Hab. ${habSeleccionada.num}`);
            }
            cerrarModal();
            renderizar();
        }

        function cerrarModal() { document.getElementById('modalGestion').style.display = 'none'; }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        
        function cerrarSesion() { if(confirm('¿Salir?')) { localStorage.clear(); window.location.href = '/login.html'; } }

        renderizar();
    </script>
</body>
</html>

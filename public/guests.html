<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Front Desk - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS | Front Desk</h1>
        <div class="nav" id="mainNav"></div>
    </div>

    <div class="container">
        <div class="card">
            <h3>⚡ Operaciones de Recepción</h3>
            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <button class="btn btn-primary" style="flex:1; padding:15px;" onclick="procesar('checkin')">📥 REGISTRAR CHECK-IN</button>
                <button class="btn btn-danger" style="flex:1; padding:15px;" onclick="procesar('checkout')">📤 PROCESAR CHECK-OUT</button>
            </div>
            
            <table>
                <thead><tr><th>Hab.</th><th>Huésped</th><th>Entrada</th><th>Salida</th><th>Estado</th></tr></thead>
                <tbody>
                    <tr><td>101</td><td>Juan Pérez</td><td>01/09</td><td>05/09</td><td><span style="color:green">✅ Hospedado</span></td></tr>
                    <tr><td>102</td><td>-</td><td>-</td><td>-</td><td><span style="color:orange">🧹 Limpieza</span></td></tr>
                    <tr><td>103</td><td>Ana García</td><td>03/09</td><td>08/09</td><td><span style="color:green">✅ Hospedado</span></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="nav.js"></script>
    <script>renderNav('guests.html');</script>
    
    <script>
        function procesar(tipo) {
            if(tipo === 'checkin') alert('✅ Abriendo formulario de Check-in...');
            if(tipo === 'checkout') alert('✅ Abriendo formulario de Check-out y Facturación...');
        }
    </script>
</body>
</html>

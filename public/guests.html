<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Front Desk - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos Modernos Dinámicos */
        .timeline-container { overflow-x: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .timeline-header { display: flex; margin-bottom: 10px; padding-left: 100px; }
        .timeline-day { flex: 1; text-align: center; font-weight: bold; color: #666; min-width: 60px; }
        
        .room-row { display: flex; align-items: center; margin-bottom: 15px; position: relative; height: 50px; }
        .room-label { width: 100px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 5px; }
        .room-status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-libre { background: #28a745; }
        .dot-ocupada { background: #dc3545; }
        
        .timeline-track { flex: 1; position: relative; height: 100%; background: #f9f9f9; border-radius: 8px; display: flex; }
        .reservation-bar { 
            position: absolute; height: 36px; top: 7px; 
            background: linear-gradient(90deg, #667eea, #764ba2); 
            border-radius: 6px; color: white; font-size: 12px; 
            display: flex; align-items: center; padding: 0 10px; 
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            overflow: hidden; white-space: nowrap;
        }
        .reservation-bar:hover { transform: scale(1.02); z-index: 10; }
        
        /* Modal Moderno */
        .glass-modal { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS <span style="font-size:14px; opacity:0.8;">| Front Desk</span></h1>
        <div class="nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="inventory.html">📦 Inventario</a>
            <a href="accounting.html">💰 Contabilidad</a>
            <a href="guests.html" class="active">👥 Ocupación</a>
            <a href="billing.html">💳 Facturación</a>
            <a href="reports.html">📈 Reportes</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
            <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3>📅 Calendario de Ocupación (Vista Semanal)</h3>
                <div>
                    <button class="btn btn-primary">Hoy</button>
                    <button class="btn btn-primary">&lt;</button>
                    <button class="btn btn-primary">&gt;</button>
                </div>
            </div>

            <!-- Línea de tiempo de días -->
            <div class="timeline-header" id="diasHeader"></div>

            <!-- Filas de habitaciones -->
            <div id="timelineBody"></div>
        </div>
    </div>

    <!-- Modal de Detalle -->
    <div id="modalDetalle" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; backdrop-filter:blur(5px);">
        <div class="glass-modal" style="margin:10% auto; padding:30px; border-radius:15px; width:400px;">
            <h3 id="modalTitle">Detalle de Reserva</h3>
            <p id="modalGuest" style="font-size:18px; margin:10px 0; font-weight:bold;"></p>
            <p id="modalDates" style="color:#666;"></p>
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button class="btn btn-success" style="flex:1">Check-in</button>
                <button class="btn btn-danger" style="flex:1">Check-out</button>
            </div>
            <button class="btn" onclick="document.getElementById('modalDetalle').style.display='none'" style="width:100%; margin-top:10px; background:#eee;">Cerrar</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        // Datos simulados para la vista dinámica
        const rooms = [
            { num: '101', status: 'libre' },
            { num: '102', status: 'ocupada' },
            { num: '103', status: 'libre' },
            { num: '104', status: 'ocupada' },
            { num: '201', status: 'libre' },
            { num: '202', status: 'ocupada' },
        ];

        const reservations = [
            { room: '102', guest: 'Juan Pérez', start: 1, length: 3, color: '#667eea' },
            { room: '104', guest: 'Familia Torres', start: 0, length: 5, color: '#764ba2' },
            { room: '202', guest: 'Ana García', start: 2, length: 2, color: '#28a745' },
        ];

        function renderTimeline() {
            const header = document.getElementById('diasHeader');
            const body = document.getElementById('timelineBody');
            
            // Renderizar días (Lun - Dom)
            let daysHtml = '';
            ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].forEach(d => {
                daysHtml += `<div class="timeline-day">${d}</div>`;
            });
            header.innerHTML = daysHtml;

            // Renderizar filas de habitaciones
            let rowsHtml = '';
            rooms.forEach(r => {
                let bars = '';
                reservations.filter(res => res.room === r.num).forEach(res => {
                    // Cálculo simple de posición para la demo
                    let left = (res.start * 14.28) + '%'; 
                    let width = (res.length * 14.28) + '%';
                    bars += `<div class="reservation-bar" style="left:${left}; width:${width}; background:${res.color};" onclick="verDetalle('${res.guest}')">
                        ${res.guest}
                    </div>`;
                });

                rowsHtml += `
                    <div class="room-row">
                        <div class="room-label">
                            <div class="room-status-dot ${r.status === 'libre' ? 'dot-libre' : 'dot-ocupada'}"></div>
                            ${r.num}
                        </div>
                        <div class="timeline-track">${bars}</div>
                    </div>
                `;
            });
            body.innerHTML = rowsHtml;
        }

        function verDetalle(guest) {
            document.getElementById('modalDetalle').style.display = 'block';
            document.getElementById('modalGuest').textContent = guest;
            document.getElementById('modalDates').textContent = '01 Sep - 05 Sep • 2 Huéspedes';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        function cerrarSesion() { if(confirm('¿Salir?')) { localStorage.clear(); window.location.href = '/login.html'; } }

        renderTimeline();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Front Desk - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos ESPECÍFICOS para que el Front Desk se vea bien */
        .timeline-container { overflow-x: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-top: 20px; }
        .timeline-header { display: flex; margin-bottom: 10px; padding-left: 100px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .timeline-day { flex: 1; text-align: center; font-weight: bold; color: #667eea; min-width: 60px; }
        
        .room-row { display: flex; align-items: center; margin-bottom: 15px; position: relative; height: 50px; }
        .room-label { width: 100px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-libre { background: #28a745; }
        .dot-ocupada { background: #dc3545; }
        
        .timeline-track { flex: 1; position: relative; height: 100%; background: #f9f9f9; border-radius: 8px; }
        
        .reservation-bar { 
            position: absolute; height: 36px; top: 7px; 
            background: linear-gradient(90deg, #667eea, #764ba2); 
            border-radius: 6px; color: white; font-size: 12px; font-weight: 600;
            display: flex; align-items: center; padding: 0 10px; 
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .reservation-bar:hover { transform: scale(1.05); z-index: 20; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 TURQUEZA HOME INN</h1>
        <!-- Aquí inyectamos el menú automáticamente -->
        <div class="nav" id="mainNav"></div>
    </div>

    <div class="container">
        <div class="card">
            <h3>📅 Vista de Ocupación Semanal</h3>
            <div class="timeline-container">
                <div class="timeline-header" id="diasHeader"></div>
                <div id="timelineBody"></div>
            </div>
        </div>
    </div>

    <script src="nav.js"></script>
    <script>renderNav('guests.html');</script>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';

        // Datos de ejemplo para visualizar
        const rooms = [
            { num: '101', status: 'libre' },
            { num: '102', status: 'ocupada' },
            { num: '103', status: 'libre' },
            { num: '104', status: 'ocupada' },
            { num: '201', status: 'libre' },
            { num: '202', status: 'ocupada' },
        ];

        const reservations = [
            { room: '102', guest: 'Juan Pérez', start: 1, length: 3 },
            { room: '104', guest: 'Familia Torres', start: 0, length: 5 },
            { room: '202', guest: 'Ana García', start: 2, length: 2 },
        ];

        function renderTimeline() {
            const header = document.getElementById('diasHeader');
            const body = document.getElementById('timelineBody');
            
            if (!header || !body) return; // Seguridad por si no carga

            // Renderizar días
            let daysHtml = '';
            ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].forEach(d => {
                daysHtml += `<div class="timeline-day">${d}</div>`;
            });
            header.innerHTML = daysHtml;

            // Renderizar filas
            let rowsHtml = '';
            rooms.forEach(r => {
                let bars = '';
                reservations.filter(res => res.room === r.num).forEach(res => {
                    let left = (res.start * 14.28) + '%'; 
                    let width = (res.length * 14.28) + '%';
                    bars += `<div class="reservation-bar" style="left:${left}; width:${width};">${res.guest}</div>`;
                });

                rowsHtml += `
                    <div class="room-row">
                        <div class="room-label">
                            <div class="status-dot ${r.status === 'libre' ? 'dot-libre' : 'dot-ocupada'}"></div>
                            ${r.num}
                        </div>
                        <div class="timeline-track">${bars}</div>
                    </div>
                `;
            });
            body.innerHTML = rowsHtml;
        }

        // Ejecutar al cargar
        renderTimeline();
    </script><script src="nav.js"></script>
<script>renderNav('nombre_de_su_archivo.html');</script>
</body>
</html>

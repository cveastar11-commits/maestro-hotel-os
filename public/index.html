<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Control - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        /* Estilos del Calendario Visual */
        .calendario-mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }
        .dia-celda { background: white; padding: 10px; text-align: center; border-radius: 6px; font-size: 13px; position: relative; min-height: 60px; border: 1px solid #eee; }
        .dia-celda.hoy { border: 2px solid #667eea; font-weight: bold; }
        .punto-ocupacion { width: 8px; height: 8px; background: #dc3545; border-radius: 50%; margin: 2px auto; }
        
        /* Mapa de Ocupación Circular */
        .ocupacion-visual { text-align: center; padding: 20px; }
        .circulo-progreso { 
            width: 150px; height: 150px; border-radius: 50%; 
            background: conic-gradient(#667eea 85%, #eee 0); 
            margin: 0 auto; display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: bold; color: #333;
        }
        
        body.dark-mode .dia-celda { background: #2d2d2d; border-color: #444; }
        body.dark-mode .circulo-progreso { background: conic-gradient(#667eea 85%, #333 0); color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav" id="mainNav"></div>
    </div>

    <div class="container">
        <div class="dashboard-layout">
            
            <!-- COLUMNA IZQUIERDA: CALENDARIO Y ACCIONES -->
            <div>
                <div class="card">
                    <h3>📅 Calendario de Ocupación (Septiembre 2026)</h3>
                    <div class="calendario-mini" id="calendarioHub">
                        <!-- Se llena con JS -->
                    </div>
                </div>

                <div class="card">
                    <h3>⚡ Acciones Rápidas (Botones Habilitados)</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <button class="btn btn-primary" onclick="irA('guests.html')">📥 Check-in Rápido</button>
                        <button class="btn btn-danger" onclick="irA('billing.html')">💳 Nueva Factura</button>
                        <button class="btn btn-success" onclick="irA('rooms.html')">🛏️ Ver Habitaciones</button>
                        <button class="btn" style="background:#ffc107; color:#333;" onclick="irA('reports.html')">📈 Reporte Diario</button>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: ESTADO DEL HOTEL -->
            <div>
                <div class="card ocupacion-visual">
                    <h3>Ocupación Actual</h3>
                    <div class="circulo-progreso">85%</div>
                    <p style="margin-top:10px; color:#666;">17 de 20 Habitaciones Vendidas</p>
                </div>

                <div class="card">
                    <h3>🔔 Alertas Recientes</h3>
                    <ul style="list-style:none; padding:0;">
                        <li style="padding:10px; border-bottom:1px solid #eee;">⚠️ Hab. 102 requiere limpieza</li>
                        <li style="padding:10px; border-bottom:1px solid #eee;">✅ Check-in: Familia Pérez (14:00)</li>
                        <li style="padding:10px;">💰 Pago recibido: Hab. 201 ($150)</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="nav.js"></script>
    <script>renderNav('index.html');</script>

    <script>
        // Función para navegar
        function irA(url) { window.location.href = url; }

        // Generar Calendario Visual
        const calContainer = document.getElementById('calendarioHub');
        let html = '';
        for(let i=1; i<=30; i++) {
            let clase = (i === 7) ? 'dia-celda hoy' : 'dia-celda'; // Simulamos que hoy es 7
            let puntos = '';
            // Simulamos ocupación aleatoria
            if(i % 2 === 0) puntos = '<div class="punto-ocupacion"></div><div class="punto-ocupacion"></div>';
            if(i % 3 === 0) puntos += '<div class="punto-ocupacion" style="background:#28a745"></div>';
            
            html += `<div class="${clase}"><strong>${i}</strong>${puntos}</div>`;
        }
        calContainer.innerHTML = html;
    </script>
</body>
</html>

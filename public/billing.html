<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facturación - Maestro Hotel OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🏨 Maestro Hotel OS</h1>
        <div class="nav">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="inventory.html">📦 Inventario</a>
            <a href="accounting.html">💰 Contabilidad</a>
            <a href="guests.html">👥 Huéspedes</a>
            <a href="billing.html" class="active">💳 Facturación</a>
            <a href="reports.html">📈 Reportes</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Modo Oscuro</button>
            <a href="#" onclick="cerrarSesion()">🚪 Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <h2>💳 Centro de Facturación</h2>
        <div class="card">
            <h3>Generar Nueva Factura</h3>
            <form style="max-width: 500px;">
                <div class="form-group"><label>Huésped</label><input type="text" placeholder="Nombre del huésped"></div>
                <div class="form-group"><label>Concepto</label><input type="text" placeholder="Ej: Habitación 101 - 3 noches"></div>
                <div class="form-group"><label>Monto ($)</label><input type="number" step="0.01"></div>
                <button class="btn btn-success">💾 Emitir Factura</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            document.querySelector('.theme-toggle').textContent = document.body.classList.contains('dark-mode') ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').textContent = '☀️ Modo Claro';
        }
        function cerrarSesion() { if(confirm('¿Cerrar sesión?')) { localStorage.clear(); window.location.href = '/login.html'; } }
    </script>
</body>
</html>
